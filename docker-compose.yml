services:
  work-order-db:
    image: postgres:17
    container_name: sastreria-work-order-db
    environment:
      POSTGRES_USER: ${WORK_ORDER_DB_USER:-sastreria}
      POSTGRES_PASSWORD: ${WORK_ORDER_DB_PASSWORD:?define WORK_ORDER_DB_PASSWORD in .env}
      POSTGRES_DB: work_order_db
    ports:
      - "5433:5432"
    volumes:
      - work-order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORK_ORDER_DB_USER:-sastreria} -d work_order_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  tailor-db:
    image: postgres:17
    container_name: sastreria-tailor-db
    environment:
      POSTGRES_USER: ${TAILOR_DB_USER:-sastreria}
      POSTGRES_PASSWORD: ${TAILOR_DB_PASSWORD:-${WORK_ORDER_DB_PASSWORD:?define TAILOR_DB_PASSWORD or WORK_ORDER_DB_PASSWORD in .env}}
      POSTGRES_DB: tailor_db
    ports:
      - "5434:5432"
    volumes:
      - tailor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TAILOR_DB_USER:-sastreria} -d tailor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-db:
    image: postgres:17
    container_name: sastreria-identity-db
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER:-sastreria}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-${WORK_ORDER_DB_PASSWORD:?define IDENTITY_DB_PASSWORD or WORK_ORDER_DB_PASSWORD in .env}}
      POSTGRES_DB: identity_db
    ports:
      - "5435:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-sastreria} -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sastreria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  work-order-db-data:
  tailor-db-data:
  identity-db-data:
  rabbitmq-data:
